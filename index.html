<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Floresta Esquecida</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <div class="game-container">

        <header class="topo">

            <div>
                <h1>🌲 A Floresta Esquecida</h1>
                <p class="subtitulo">
                    Nem toda escolha pode ser desfeita...
                </p>
            </div>

            <button class="menu-btn" onclick="abrirMenu()">
                ☰
            </button>

        </header>


        <section class="status">

            <div class="status-item">
                <span>❤️</span>
                <div>
                    <small>VIDA</small>
                    <strong id="vida">100</strong>
                </div>
            </div>

            <div class="status-item">
                <span>💰</span>
                <div>
                    <small>MOEDAS</small>
                    <strong id="moedas">0</strong>
                </div>
            </div>

            <div class="status-item">
                <span>📖</span>
                <div>
                    <small>CAPÍTULO</small>
                    <strong id="capitulo">1</strong>
                </div>
            </div>

        </section>


        <div class="barra-vida">
            <div id="barraVida"></div>
        </div>


        <main class="historia-container">

            <div class="local">
                <span id="iconeLocal">🌲</span>
                <span id="nomeLocal">A estrada</span>
            </div>

            <h2 id="titulo">
                Acordando na floresta
            </h2>

            <div class="imagem-local" id="imagemLocal">
                🌫️
            </div>

            <div class="texto">
                <p id="historia"></p>
            </div>

            <div id="dialogo"></div>

            <div class="opcoes" id="opcoes"></div>

        </main>


        <section class="inventario">

            <h3>🎒 Inventário</h3>

            <div id="itens">
                <span class="vazio">
                    Você não possui itens.
                </span>
            </div>

        </section>


        <section class="objetivos">

            <h3>📜 Objetivos</h3>

            <p id="objetivo">
                Descubra onde você está.
            </p>

        </section>


        <footer>

            <button onclick="salvarJogo()">
                💾 Salvar
            </button>

            <button onclick="carregarJogo()">
                📂 Carregar
            </button>

            <button onclick="abrirInventario()">
                🎒 Inventário
            </button>

        </footer>

    </div>


    <div id="menu" class="modal">

        <div class="modal-content">

            <button class="fechar" onclick="fecharMenu()">
                ×
            </button>

            <h2>⚙️ Menu</h2>

            <button onclick="salvarJogo(); fecharMenu();">
                💾 Salvar jogo
            </button>

            <button onclick="carregarJogo(); fecharMenu();">
                📂 Carregar jogo
            </button>

            <button onclick="reiniciarJogo()">
                🔄 Novo jogo
            </button>

        </div>

    </div>


    <div id="modalInventario" class="modal">

        <div class="modal-content inventario-modal">

            <button class="fechar" onclick="fecharInventario()">
                ×
            </button>

            <h2>🎒 Seu Inventário</h2>

            <div id="inventarioGrande"></div>

        </div>

    </div>


    <div id="notificacao"></div>


    <script src="script.js"></script>

</body>
</html>
